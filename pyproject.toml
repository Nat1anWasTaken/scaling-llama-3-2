[project]
name = "scaling-llama-3-2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyarrow>=26.0.1",
    "pylance>=14.0.2",
    "torch>=2.15.0",
    "transformers>=5.22.1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
    "ty>=0.0.97",
]

[tool.ruff.lint]
extend-select = ["ANN", "N"]
