[project]
name = "scaling-llama-3-2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "kernels>=0.17.2,<0.18.0 ; sys_platform == 'linux'",
    "pyarrow>=26.0.1",
    "pylance>=14.0.2",
    "torch>=2.15.0",
    "transformers>=5.22.1",
    "wandb>=0.31.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
# CPU wheels on macOS only. Linux falls through to PyPI, whose torch wheels ship CUDA
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'darwin'" }]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
    "ty>=0.0.97",
]

[tool.ty.rules]
# torch declares `nn.Module.forward: Callable[..., Any]`, so ty flags every `def forward`
# override as writing to a mutable attribute. Not a real error for nn.Module subclasses
invalid-mutable-override = "ignore"

[tool.ruff.lint]
extend-select = ["ANN", "N"]
